<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }
        nav { background: #333; padding: 1rem; position: fixed; width: 100%; top: 0; }
        nav a { color: white; margin: 0 1rem; text-decoration: none; }
        section { min-height: 100vh; padding: 5rem 1rem 1rem; }
        #home { background: #f0f0f0; }
        #about { background: #e0e0e0; }
        #skills { background: #d0d0d0; }
        h2 { color: #333; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#skills">Skills</a>
    </nav>
    
    <section id="home">
        <h2>Home Section</h2>
        <p>This is the home section content.</p>
    </section>
    
    <section id="about">
        <h2>About Section</h2>
        <p>This is the about section content.</p>
    </section>
    
    <section id="skills">
        <h2>Skills Section</h2>
        <p>This is the skills section content.</p>
    </section>

    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
    </script>
</body>
</html>
